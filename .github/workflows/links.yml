name: links
on:
  pull_request:
    paths: ['**.md']
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.md'):
              if '.git' in p.parts: continue
              for m in re.finditer(r'\]\(([^)#\s]+)(?:#[^)]*)?\)', p.read_text(encoding='utf-8', errors='ignore')):
                  t = m.group(1)
                  if re.match(r'[a-z]+:', t): continue
                  if not (p.parent / t).exists(): bad.append(f'{p}: {t}')
          print('\n'.join(bad) or 'all relative links resolve')
          sys.exit(1 if bad else 0)
          PY
